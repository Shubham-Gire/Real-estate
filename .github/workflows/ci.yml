name: EstateHub Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-and-test:
    name: Backend Build & Tests (Java 21 LTS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: realestate_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Run Backend Tests
        run: |
          cd backend
          mvn -B clean test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: realestate_db
          DB_USER: postgres
          DB_PASSWORD: root
          JWT_SECRET: ContinuousIntegrationTestSecretKeyWithHighEntropyForSigningTokens2026!

      - name: Package Backend JAR
        run: |
          cd backend
          mvn -B package -DskipTests

  frontend-build:
    name: Frontend Build & Typecheck (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Compile and Build Frontend
        run: |
          cd frontend
          npm run build
