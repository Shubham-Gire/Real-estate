services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: estatehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-realestate_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-realestate_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Spring Boot 3 Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: estatehub-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-realestate_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-EstateHubSuperSecretKeyForJWTTokenSigning2026SecureKeyWithHighEntropy!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@estatehub.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminSecure2026!}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      UPLOAD_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads

  # 3. React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: estatehub-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
  uploads-data:
